name: test-setup-cli-branch

on:
  workflow_dispatch:

jobs:
  host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - 2.100.1
          - latest
    steps:
      - uses: supabase/setup-cli@codex/v1-musl-apk
        with:
          version: ${{ matrix.version }}
          github-token: ${{ github.token }}

      - run: supabase --version
      - run: supabase --help

  alpine:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2.100.1
          - latest
    defaults:
      run:
        shell: sh
    steps:
      - uses: supabase/setup-cli@codex/v1-musl-apk
        with:
          version: ${{ matrix.version }}
          github-token: ${{ github.token }}

      - run: supabase --version
      - run: supabase --help
